[package]
name = "mesh_shaders"
version = "0.1.0"
edition = "2021"

[dependencies]
ash = "0.38"
ash-window = "0.13"
winit = "0.29"
raw-window-handle = "0.6"
glam = "0.25"
bytemuck = { version = "1.14", features = ["derive"] }
image = "0.24"
gpu-allocator = { version = "0.27", features = ["vulkan"] }

[profile.dev]
opt-level = 1
